services:

  backend:

    build:
      context: ./greenpulse-ai/backend

    container_name: greenpulse-backend

    ports:
      - "8000:8000"

    env_file:
    - ./greenpulse-ai/backend/.env

    restart: unless-stopped


  frontend:

    build:
      context: ./frontend

    container_name: greenpulse-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped